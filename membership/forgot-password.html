<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Password Assistance | SovereignAqua Foundation</title><style>:root{--bg:#07131f;--text:#eef8ff;--muted:#b7cbd8;--a:#00cfff;--line:rgba(255,255,255,.13)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(720px,92%);margin:auto}header{border-bottom:1px solid var(--line);padding:18px 0}a{color:var(--a)}main{padding:80px 0}.card{border:1px solid var(--line);border-radius:20px;padding:32px;background:rgba(255,255,255,.05)}.eyebrow{color:var(--a);font-weight:800;letter-spacing:.14em;font-size:.75rem}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.1}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#06131c;color:#fff;font:inherit}button{margin-top:18px;border:0;border-radius:999px;background:var(--a);color:#00131b;padding:13px 20px;font-weight:800;cursor:pointer}footer{text-align:center;color:var(--muted);border-top:1px solid var(--line);padding:25px}</style></head><body><header><div class="wrap"><a href="member-login.html">← Back to Member Portal</a></div></header><main><div class="wrap"><div class="card"><span class="eyebrow">ACCOUNT ASSISTANCE</span><h1>Password Assistance</h1><p class="muted">The member authentication system is not yet connected to a server-side account service. This page therefore does not collect or transmit credentials.</p><form id="help"><label for="email">Member email address</label><input id="email" type="email" required><button type="submit">Contact Membership Support</button></form><p class="muted" id="status"></p></div></div></main><footer>© 2026 SovereignAqua Research &amp; Development Foundation · <a href="../contact.html">Contact</a></footer><script>document.getElementById('help').addEventListener('submit',e=>{e.preventDefault();const email=document.getElementById('email').value;const subject=encodeURIComponent('SovereignAqua Member Account Assistance');const body=encodeURIComponent('Please assist with my member account.\n\nMember email: '+email);document.getElementById('status').textContent='Opening your email client. No password is requested or transmitted.';location.href='mailto:info@sovereignaqua.org?subject='+subject+'&body='+body})</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">SovereignAqua spinning world mark</title>
<desc id="desc">Animated globe representing global research and sustainable development.</desc>
<defs>
  <radialGradient id="ocean" cx="35%" cy="30%"><stop offset="0" stop-color="#8ae7f5"/><stop offset=".55" stop-color="#2aa9bd"/><stop offset="1" stop-color="#063642"/></radialGradient>
  <linearGradient id="land" x1="0" x2="1"><stop stop-color="#8ce9b7"/><stop offset="1" stop-color="#d8f6b2"/></linearGradient>
  <clipPath id="globe"><circle cx="400" cy="400" r="250"/></clipPath>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="400" cy="400" r="270" fill="none" stroke="#52d6e8" stroke-opacity=".22" stroke-width="4"/>
<g filter="url(#glow)">
  <circle cx="400" cy="400" r="250" fill="url(#ocean)" stroke="#b8f4fb" stroke-opacity=".75" stroke-width="5"/>
  <g clip-path="url(#globe)" fill="none" stroke="#d9f8fb" stroke-opacity=".28" stroke-width="4">
    <ellipse cx="400" cy="400" rx="235" ry="105"/><ellipse cx="400" cy="400" rx="235" ry="185"/><ellipse cx="400" cy="400" rx="105" ry="250"/><ellipse cx="400" cy="400" rx="185" ry="250"/>
    <path d="M150 400h500M190 300h420M190 500h420"/>
  </g>
  <g clip-path="url(#globe)" fill="url(#land)">
    <path d="M235 260l42-31 54 18 31 45-25 29-49-10-22 35-38-18-8-42zm210-8l48-17 62 28 12 47-38 25-44-17-35 21-24-34zm-40 118l45-20 42 25 9 47-38 26-38-14-31 24-22-35zm-132 91l46-18 43 28 5 46-48 24-43-29z"/>
  </g>
</g>
<g fill="none" stroke="#8ce9b7" stroke-width="6" stroke-linecap="round" opacity=".85">
  <path d="M135 400a265 265 0 0 0 530 0" stroke-dasharray="18 22"/>
</g>
<animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="18s" repeatCount="indefinite"/>
</svg>